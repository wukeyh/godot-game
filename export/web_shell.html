<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body, #canvas {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: 0;
			overflow: hidden;
			touch-action: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-user-select: none;
			user-select: none;
		}
		body {
			background: #111827;
			color: #e5e7eb;
		}
		#canvas {
			display: block;
		}
		#status {
			position: fixed;
			left: calc(16px + env(safe-area-inset-left));
			right: calc(16px + env(safe-area-inset-right));
			bottom: calc(24px + env(safe-area-inset-bottom));
			z-index: 2;
			text-align: center;
			font: 16px/1.4 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
			pointer-events: none;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">当前浏览器不支持 HTML5 Canvas，请更新或更换浏览器。</canvas>
	<div id="status">加载中</div>
	<script src="$GODOT_URL"></script>
	<script>
		var statusEl = document.getElementById("status");
		function showStatus(text) {
			statusEl.textContent = text;
		}
		if (typeof Engine === "undefined") {
			showStatus("引擎脚本没有加载。");
		} else if (!Engine.isWebGLAvailable()) {
			showStatus("WebGL 不可用，请使用支持 WebGL 的现代浏览器。");
		} else {
			var engine = new Engine($GODOT_CONFIG);
			engine.startGame({
				onProgress: function (current, total) {
					if (total > 0) {
						showStatus("加载中 " + Math.floor(current / total * 100) + "%");
					} else {
						showStatus("加载中");
					}
				}
			}).then(function () {
				statusEl.remove();
			}).catch(function (err) {
				var message = (err && err.message) ? err.message : String(err);
				console.error(message);
				showStatus(message);
			});
		}
	</script>
</body>
</html>
